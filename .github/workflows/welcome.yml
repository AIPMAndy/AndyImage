name: Welcome New Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 感谢你提交第一个 Issue！

            我们会尽快查看并回复。在等待期间，你可以：
            - 查看 [贡献指南](CONTRIBUTING.md)
            - 浏览现有的 [提示词库](prompts/)
            - 加入我们的 [Discussions](../../discussions)

            期待与你交流！🎨

          pr-message: |
            🎉 感谢你的第一个 Pull Request！

            我们很高兴看到你的贡献。请确保：
            - ✅ 遵循了 [贡献指南](CONTRIBUTING.md)
            - ✅ 提示词格式正确
            - ✅ 提供了清晰的描述

            我们会尽快审查你的贡献。感谢你让 AndyImage 变得更好！🚀
